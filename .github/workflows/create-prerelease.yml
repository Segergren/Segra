name: Create Prerelease

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release increment (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.get_version.outputs.new_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $newVersion = ./.github/scripts/next-prerelease-version.ps1 -ReleaseType '${{ github.event.inputs.release_type }}'
          "new_version=$newVersion" >> $env:GITHUB_ENV
          "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        shell: pwsh

      - name: Update Frontend version
        working-directory: ./Frontend
        shell: pwsh
        run: |
          $content = Get-Content package.json -Raw
          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $packageJson.version = $env:new_version
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content package.json -NoNewline
          Write-Host "Updated version: $(Select-String -Path package.json -Pattern 'version')"

      - name: Build frontend; restore backend and install vpk in parallel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # vpk install and the NuGet restore don't depend on the frontend, so run them
          # in the background while the frontend builds; both are awaited before publish.
          $vpkJob = Start-Job {
            dotnet tool install -g vpk --version 1.2.0
            if ($LASTEXITCODE -ne 0) { throw "vpk install exited $LASTEXITCODE" }
          }
          $restoreJob = Start-Job -ArgumentList $PWD.Path {
            param($root)
            Set-Location $root
            dotnet restore -r win-x64
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore exited $LASTEXITCODE" }
          }

          Push-Location Frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci exited $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build exited $LASTEXITCODE" }
          Pop-Location

          # Copy the frontend build into Resources/wwwroot so dotnet publish embeds it.
          $destination = "./Resources/wwwroot"
          if (-Not (Test-Path -Path $destination)) { New-Item -ItemType Directory -Path $destination -Force | Out-Null }
          Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "./Frontend/dist/*" -Destination $destination -Recurse -Force

          # Native stderr from a job surfaces as error records, so relax ErrorAction and
          # merge it into output; gate success on each job's State (jobs throw on failure).
          $ErrorActionPreference = 'Continue'
          Write-Host "=== vpk tool install ==="
          Receive-Job $vpkJob -Wait 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "=== dotnet restore -r win-x64 ==="
          Receive-Job $restoreJob -Wait 2>&1 | ForEach-Object { Write-Host $_ }
          if ($vpkJob.State -ne 'Completed') { throw "vpk install job failed (state: $($vpkJob.State))" }
          if ($restoreJob.State -ne 'Completed') { throw "dotnet restore job failed (state: $($restoreJob.State))" }

      - name: Publish the App
        run: dotnet publish Segra.csproj -c Release -f net10.0-windows10.0.19041.0 --self-contained -r win-x64 -o publish --no-restore -p:Version=${{ env.new_version }}
        shell: pwsh

      - name: Publish hotkey broker
        run: dotnet publish HotkeyBroker/Segra.Hotkeys/Segra.Hotkeys.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -o publish --no-restore
        shell: pwsh

      - name: Upload Segra binaries for signing (Pass 1)
        id: upload_unsigned_exe
        uses: actions/upload-artifact@v7
        with:
          name: Segra-exe-unsigned
          path: |
            ./publish/Segra.exe
            ./publish/Segra.dll
            ./publish/Segra.Hotkeys.exe
          if-no-files-found: error
          retention-days: 1

      - name: Send Pushover notification (Pass 1)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Invoke-RestMethod -Method POST -TimeoutSec 15 `
              -Uri "${{ secrets.PUSHOVER_API_URL }}/1/messages.json" `
              -Body @{
                token   = '${{ secrets.PUSHOVER_TOKEN }}'
                user    = '${{ secrets.PUSHOVER_USER }}'
                title   = 'Segra prerelease'
                message = 'Packaging v${{ env.new_version }}'
              } | Out-Null
            Write-Host "Pushover notification sent"
          } catch {
            Write-Warning "Pushover notification failed: $_"
          }

      - name: Sign Segra.exe (Pass 1)
        id: sign_pass1
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Segra
          signing-policy-slug: release-signing
          artifact-configuration-slug: publish
          github-artifact-id: ${{ steps.upload_unsigned_exe.outputs.artifact-id }}
          wait-for-completion: false

      - name: Wait for signing and download (Pass 1)
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: ./.github/scripts/wait-signpath.ps1 -SignedArtifactUrl '${{ steps.sign_pass1.outputs.signed-artifact-download-url }}' -OutputDirectory ./publish

      - name: Package with vpk
        run: vpk pack -u Segra -v ${{ env.new_version }} -p ./publish -e Segra.exe -o ./output --packTitle "Segra" --noPortable -i ./Resources/icon.ico -s ./Resources/splash.png --splashProgressColor "#fecb00" --framework webview2,vcredist143-x64
        shell: pwsh

      - name: Upload Velopack output for signing (Pass 2)
        id: upload_unsigned_output
        uses: actions/upload-artifact@v7
        with:
          name: Segra-output-unsigned
          path: ./output
          if-no-files-found: error
          retention-days: 1

      - name: Send Pushover notification (Pass 2)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Invoke-RestMethod -Method POST -TimeoutSec 15 `
              -Uri "${{ secrets.PUSHOVER_API_URL }}/1/messages.json" `
              -Body @{
                token   = '${{ secrets.PUSHOVER_TOKEN }}'
                user    = '${{ secrets.PUSHOVER_USER }}'
                title   = 'Segra prerelease'
                message = 'Finalizing v${{ env.new_version }} installer'
              } | Out-Null
            Write-Host "Pushover notification sent"
          } catch {
            Write-Warning "Pushover notification failed: $_"
          }

      - name: Sign installer + nupkg (Pass 2)
        id: sign_pass2
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Segra
          signing-policy-slug: release-signing
          artifact-configuration-slug: output
          github-artifact-id: ${{ steps.upload_unsigned_output.outputs.artifact-id }}
          wait-for-completion: false

      - name: Wait for signing and download (Pass 2)
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: ./.github/scripts/wait-signpath.ps1 -SignedArtifactUrl '${{ steps.sign_pass2.outputs.signed-artifact-download-url }}' -OutputDirectory ./output

      - name: Regenerate Velopack manifests
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem ./output/Segra-*-full.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No nupkg found in ./output" }
          $size = $nupkg.Length
          $sha1 = (Get-FileHash $nupkg.FullName -Algorithm SHA1).Hash.ToUpperInvariant()
          $sha256 = (Get-FileHash $nupkg.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "Signed nupkg: $($nupkg.Name) size=$size sha1=$sha1"

          $releasesPath = './output/RELEASES'
          if (Test-Path $releasesPath) {
            $newLine = "$sha1 $($nupkg.Name) $size"
            [System.IO.File]::WriteAllText((Resolve-Path $releasesPath), $newLine, [System.Text.UTF8Encoding]::new($true))
            Write-Host "Rewrote RELEASES"
          }

          $winJsonPath = './output/releases.win.json'
          if (Test-Path $winJsonPath) {
            $winJson = Get-Content $winJsonPath -Raw | ConvertFrom-Json
            foreach ($asset in $winJson.Assets) {
              if ($asset.FileName -eq $nupkg.Name) {
                $asset.SHA1 = $sha1
                $asset.SHA256 = $sha256
                $asset.Size = $size
              }
            }
            $winJson | ConvertTo-Json -Depth 10 -Compress | Set-Content -Path $winJsonPath -NoNewline -Encoding utf8
            Write-Host "Rewrote releases.win.json"
          }

      - name: Create a Git Tag
        run: |
          git tag v${{ env.new_version }}
          git push origin v${{ env.new_version }}
        shell: pwsh

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Segra
          path: ./output
          compression-level: 0
          retention-days: 1

  pre-release:
    # Wait for both builds, but publish as long as the Windows build succeeded (the Linux job is
    # continue-on-error, so a Linux failure can't block the Windows prerelease).
    needs: [build, build_linux]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact (Windows)
        uses: actions/download-artifact@v8
        with:
          name: Segra

      - name: Download Linux Build Artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Segra-Linux
          path: linux

      - name: Create GitHub Release (Pre-Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.new_version }}
          name: "Release v${{ needs.build.outputs.new_version }}"
          prerelease: true
          generate_release_notes: false
          files: |
            ./Segra-win-Setup.exe
            ./RELEASES
            ./releases.win.json
            ./assets.win.json
            ./Segra-${{ needs.build.outputs.new_version }}-full.nupkg
            ./linux/Segra.flatpak

  # Linux Flatpak, built in parallel with Windows; continue-on-error so it never blocks that build.
  # It computes the version itself (same tags, same result) so it doesn't wait on another job.
  build_linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $newVersion = ./.github/scripts/next-prerelease-version.ps1 -ReleaseType '${{ github.event.inputs.release_type }}'
          "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Flatpak toolchain + OBS media deps
        # OBS's media libs (FFmpeg 6, x264, jansson, rist, srt, mbedtls) so build-flatpak.sh can bundle its ldd closure.
        # obs-ffmpeg.so links the openssl srt variant, obs-outputs.so needs all three mbedtls libs,
        # and libobs-scripting needs luajit.
        run: |
          sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y flatpak flatpak-builder \
            ffmpeg libavcodec-extra libx264-164 libjansson4 librist4 libsrt1.5-gnutls \
            libsrt1.5-openssl libmbedtls14t64 libmbedx509-1t64 libmbedcrypto7t64 libluajit-5.1-2
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak (OBS bundled)
        run: SEGRA_VERSION=${{ steps.get_version.outputs.new_version }} ./build-flatpak.sh

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Segra-Linux
          path: ./output/Segra.flatpak
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Separate, non-blocking job; only needs the installer, so it runs alongside the Linux build and release.
  virustotal:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: Segra

      - name: Upload installer and binaries to VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::VIRUSTOTAL_API_KEY secret not set; skipping VirusTotal upload"
            exit 0
          fi
          # The broker and app code are scanned on their own since VirusTotal may not unpack the Velopack installer.
          mkdir -p vt
          unzip -j -o Segra-*-full.nupkg lib/app/Segra.Hotkeys.exe lib/app/Segra.dll -d vt
          for FILE in ./Segra-win-Setup.exe ./vt/Segra.Hotkeys.exe ./vt/Segra.dll; do
            if [ ! -f "$FILE" ]; then
              echo "::warning::$FILE not found; skipping"
              continue
            fi
            # /files caps at 32MB; larger files need a one-time upload URL.
            UPLOAD_URL=https://www.virustotal.com/api/v3/files
            if [ "$(stat -c %s "$FILE")" -gt 33554432 ]; then
              UPLOAD_URL=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" \
                https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data')
            fi
            echo "Uploading $FILE to VirusTotal..."
            ANALYSIS_ID=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" \
              -F "file=@${FILE}" "$UPLOAD_URL" | jq -r '.data.id')
            REPORT_URL="https://www.virustotal.com/gui/file-analysis/$ANALYSIS_ID"
            echo "$(basename "$FILE"): $REPORT_URL"
          done
